name: Testes e build web (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Versão do Godot usada em CI e no build web. Trocar aqui para atualizar.
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot (headless)
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Importar recursos
        run: godot --headless --path . --import || true

      - name: Testes de regra
        run: godot --headless --path . -s res://scripts/tests/test_dnd_rules.gd

      - name: Testes de combate
        run: godot --headless --path . -s res://scripts/tests/test_combat_rules.gd

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot e export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$TPL_DIR/"

      - name: Importar recursos
        run: godot --headless --path . --import || true

      - name: Exportar build web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Garantir arquivo de entrada
        run: test -f build/web/index.html

      - name: Incluir páginas de apoio (comparação de estética)
        run: |
          cp -r site/. build/web/
          mkdir -p build/web/assets/estetica
          cp -r assets/estetica/. build/web/assets/estetica/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
